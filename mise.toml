[tools]
bazelisk = "1.29.0"
python = "3.13.15"
uv = "0.12.5"

[tasks.scheduler-setup]
description = "Create and populate the Test Scheduler pool"
run = "uv run --frozen python .buildkite/setup_pool.py"

[tasks.scheduler-consume]
description = "Lease and run Bazel targets from the Test Scheduler pool"
run = "uv run --frozen python .buildkite/consume_pool.py"

[tasks.dispatch-initial]
description = "Lease and dispatch all initial attempts from one coordinator"
run = "uv run --frozen python .buildkite/dispatch_initial.py"

[tasks.scheduler-verify]
description = "Verify the final Test Scheduler pool metrics"
run = "uv run --frozen python .buildkite/verify_pool.py"
