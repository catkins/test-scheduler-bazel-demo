agents:
  queue: "hosted"

secrets:
  - BUILDBUDDY_API_KEY

# This cache volume lets the mise plugin reuse downloaded tools on hosted agents.
cache: ".buildkite/cache-volume"

steps:
  - label: ":test_tube: Create 600-target pool"
    key: "populate"
    command: mise run scheduler-setup
    plugins:
      - mise#v1.1.4:
          version: 2026.7.6

  - label: ":bazel: Dispatch all initial targets"
    key: "dispatch-initial"
    command: mise run dispatch-initial
    depends_on: "populate"
    retry:
      automatic:
        - exit_status: -1
          limit: 2
    plugins:
      - mise#v1.1.4:
          version: 2026.7.6
