steps:
  - label: ":test_tube: Create 1,000-target pool"
    key: "setup"
    command: mise run scheduler-setup
    plugins:
      - mise#v1.1.4:
          version: 2026.7.6
    agents:
      queue: "hosted"

  - label: ":bazel: Dispatch all initial targets"
    key: "dispatch-initial"
    command: mise run dispatch-initial
    depends_on: "setup"
    retry:
      automatic:
        - exit_status: -1
          limit: 2
    plugins:
      - mise#v1.1.4:
          version: 2026.7.6
    agents:
      queue: "hosted"

  - label: ":repeat: Retry runner %n"
    key: "retry-runners"
    command: mise run scheduler-consume
    depends_on: "dispatch-initial"
    parallelism: 5
    plugins:
      - mise#v1.1.4:
          version: 2026.7.6
    agents:
      queue: "hosted"

  - label: ":white_check_mark: Verify scheduling policy"
    key: "verify"
    command: mise run scheduler-verify
    depends_on: "retry-runners"
    plugins:
      - mise#v1.1.4:
          version: 2026.7.6
    agents:
      queue: "hosted"
