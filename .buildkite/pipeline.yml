steps:
  - label: ":test-engine: Create 1,000-target pool"
    key: "setup"
    command: mise run scheduler-setup
    plugins:
      - mise#v1.1.4:
          version: 2026.7.6
    agents:
      queue: "hosted"

  - label: ":bazel: Scheduler runner %n"
    key: "scheduler-runners"
    command: mise run scheduler-consume
    depends_on: "setup"
    parallelism: 2
    plugins:
      - mise#v1.1.4:
          version: 2026.7.6
    agents:
      queue: "hosted"

  - label: ":white_check_mark: Verify scheduling policy"
    key: "verify"
    command: mise run scheduler-verify
    depends_on: "scheduler-runners"
    plugins:
      - mise#v1.1.4:
          version: 2026.7.6
    agents:
      queue: "hosted"
